name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  MIX_ENV: test
  ELIXIR_VERSION: "1.18.3"
  OTP_VERSION: "27.2"

jobs:
  compile:
    name: Compile & Warnings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Cache deps & build
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-

      - run: mix deps.get
      - run: mix deps.compile

      - name: Compile with warnings as errors
        run: mix compile --warnings-as-errors

      # Retired/deprecated-package check. Lives here rather than in the
      # `hex_vet` job because it needs a resolved dep tree (and the Hex
      # registry), which this job already fetches; the `hex_vet` job is
      # deliberately dep-free. Not in `test`, which would run it 3×.
      - name: Audit deps for retired packages
        run: mix hex.audit

  format:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Cache deps
        uses: actions/cache@v5
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-

      - run: mix deps.get
      - run: mix format --check-formatted

  credo:
    name: Credo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Cache deps & build
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-

      - run: mix deps.get
      - run: mix credo --strict

  hex_vet:
    name: Hex Vet (sec version ledger)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      # No deps are fetched here on purpose: `elixir -e` evaluates the
      # ledger and the lock file as plain Elixir data, so the gate runs
      # before (and independently of) any dependency resolution. Using
      # `mix run` here cannot work — there is no `mix deps.get` step and
      # `mix run` would try to load/compile the project first.
      - name: Verify mix.lock against hex_vet.exs floors
        run: |
          elixir -e '
            # `mix.lock` is plain Elixir data: `%{"req": {...}}` is keyword
            # syntax, so its keys are atoms — same as the ledger keys.
            # `emit_warnings: false` suppresses the "quotes are not
            # required" tokenizer warning for all ~25 lock entries.
            eval = fn path ->
              path
              |> File.read!()
              |> Code.string_to_quoted!(file: path, emit_warnings: false)
              |> Code.eval_quoted()
              |> elem(0)
            end

            lock = eval.("mix.lock")
            vet = eval.("hex_vet.exs")

            failures =
              Enum.flat_map(vet, fn {pkg, floor} ->
                min = String.replace_leading(floor, ">= ", "")

                case Map.get(lock, pkg) do
                  {:hex, ^pkg, ver, _, _, _, _, _} ->
                    if Version.compare(ver, min) == :lt, do: [{pkg, ver, floor}], else: []

                  nil ->
                    [{pkg, :missing_from_lock, floor}]

                  other ->
                    [{pkg, other, floor}]
                end
              end)

            if failures == [] do
              IO.puts("[hex_vet] OK — all #{length(vet)} vetted deps meet their floor.")
            else
              IO.puts("[hex_vet] FAIL — mix.lock violates the security version ledger:")

              for {pkg, ver, floor} <- failures do
                IO.puts("  - #{pkg}: lock=#{inspect(ver)} does not satisfy #{floor}")
              end

              System.halt(1)
            end
          '

  test:
    name: Tests (OTP ${{ matrix.otp }} / Elixir ${{ matrix.elixir }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Minimum supported: Elixir 1.18 (stdlib JSON) on OTP 26.
          - os: ubuntu-latest
            elixir: "1.18.0"
            otp: "26.2.5"
          # Canonical combo also used by format / credo / dialyzer / publish.
          - os: ubuntu-latest
            elixir: "1.18.3"
            otp: "27.2"
          # Latest in the 1.18 line on the latest OTP.
          - os: ubuntu-latest
            elixir: "1.18.4"
            otp: "27.2"
    steps:
      - uses: actions/checkout@v6

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Cache deps & build
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-

      - run: mix deps.get
      - run: mix deps.compile
      - run: mix compile
      - run: mix test

  dialyzer:
    name: Dialyzer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Cache deps & build
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-

      - name: Cache PLTs
        uses: actions/cache@v5
        with:
          path: priv/plts
          key: ${{ runner.os }}-plt-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-plt-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-

      - run: mix deps.get
      - run: mix deps.compile
      - run: mix compile
      - run: mkdir -p priv/plts
      - run: mix dialyzer

  publish:
    name: Publish to Hex
    runs-on: ubuntu-latest
    needs: [compile, format, credo, hex_vet, test, dialyzer]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v6

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Set version from tag
        env:
          GIT_REF: ${{ github.ref }}
        run: |
          TAG_VERSION="${GIT_REF#refs/tags/v}"
          sed -i "s/@version \".*\"/@version \"${TAG_VERSION}\"/" mix.exs
          grep '@version' mix.exs

      - run: mix deps.get
        env:
          MIX_ENV: dev
      - run: mix compile
        env:
          MIX_ENV: dev

      - name: Publish to Hex
        run: mix hex.publish --yes
        env:
          MIX_ENV: dev
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
